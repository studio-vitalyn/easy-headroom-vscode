name: Feature request
description: Suggest an improvement
labels: ['enhancement']
body:
  - type: dropdown
    id: area
    attributes:
      label: Which area?
      options:
        - RTK (shell output compression)
        - Headroom (API proxy)
        - TokenSave (code graph / MCP)
        - Dashboard / status bar
        - Settings / setup
        - Docker bundle (shared instance)
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation you're in, not only the solution you have in mind.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
